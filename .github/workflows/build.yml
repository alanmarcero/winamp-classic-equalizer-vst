name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    if: false
    # macos-14 was retired on 2026-11-02. macos-15 is arm64 and still builds the universal binary.
    runs-on: macos-15
    env:
      BUNDLE: build/WinampClassicEqualizer_artefacts/Release/VST3/Winamp Classic Equalizer.vst3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Sign ad hoc
        run: codesign --force --deep --sign - "$BUNDLE"

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          echo "3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f  pluginval.zip" | shasum -a 256 -c -
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$BUNDLE"

      - name: Package
        run: |
          mkdir -p dist
          ditto "$BUNDLE" "dist/$(basename "$BUNDLE")"
          python3 scripts/package_notices.py dist
          ditto -c -k dist WinampClassicEqualizer-VST3-macOS.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WinampClassicEqualizer-VST3-macOS
          path: WinampClassicEqualizer-VST3-macOS.zip

  windows:
    runs-on: windows-latest
    env:
      BUNDLE: build/WinampClassicEqualizer_artefacts/Release/VST3/Winamp Classic Equalizer.vst3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Capture preview screenshot
        continue-on-error: true
        run: ./build/Release/wce_capture.exe docs/screenshots/preview.png

      - name: Upload preview screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-screenshot
          path: docs/screenshots/preview.png
          if-no-files-found: ignore

      - name: Validate with pluginval
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          $hash = (Get-FileHash pluginval.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab") { throw "pluginval.zip SHA-256 mismatch: $hash" }
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate "$env:BUNDLE"

      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "$env:BUNDLE" dist/
          python scripts/package_notices.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/* -DestinationPath WinampClassicEqualizer-VST3-Windows.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WinampClassicEqualizer-VST3-Windows
          path: WinampClassicEqualizer-VST3-Windows.zip

  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' && (needs.macos.result == 'skipped' || needs.macos.result == 'success') }}
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/WinampClassicEqualizer-VST3-*.zip
          body: '![Winamp Classic Equalizer](https://raw.githubusercontent.com/alanmarcero/winamp-classic-equalizer-vst/${{ github.ref_name }}/docs/screenshots/preview.png)'
          fail_on_unmatched_files: true
          generate_release_notes: true

  update-preview:
    # Refreshes docs/screenshots/preview.png (the image OpenVST Manager shows) from the
    # real editor capture whenever UI-affecting files change on main.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: windows
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-screenshot
          path: preview
      - name: Commit refreshed preview if changed
        run: |
          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qE '^(Source|assets|Tools|tools|Tests)/' || { echo "No UI changes; keeping preview."; exit 0; }
          cp preview/preview.png docs/screenshots/preview.png
          if git diff --quiet -- docs/screenshots/preview.png; then echo "Preview unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/preview.png
          git commit -m "docs: refresh preview screenshot [skip ci]"
          git push
